# Scrape configuration for a single-host Mihenk deployment.
#
# /metrics is disabled outright unless METRICS_TOKEN is set, and requires that
# token as a bearer credential. It is not the user JWT and must not be one: the
# endpoint exposes queue depth, failure rates and host statistics, which are
# operational detail rather than public information.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mihenk-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['api:4000']

  # The workers run on the host by default (see the note at the top of
  # docker-compose.yml), so they are scraped through the host gateway rather
  # than by service name. Each process sets a distinct `role` label, so their
  # series do not overwrite each other.
  - job_name: mihenk-workers
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['host.docker.internal:4001']
        labels:
          component: worker
