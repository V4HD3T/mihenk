name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The unit/HTTP tests need no database, but the course-isolation tests do -
    # they check that one course's content is invisible to another course's
    # users, which is enforced entirely in SQL and can't be meaningfully mocked.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codecloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The submission path enqueues a grading job, so the happy path needs a
      # queue as well as a database.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: codecloud_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: 6379
      # Refuse to let the isolation suite skip itself in CI: a green build with
      # skipped tests is exactly the false confidence they exist to prevent.
      REQUIRE_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  sandbox:
    name: Sandbox isolation (real containers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Only the python image is needed for the containment checks, and it is
      # by far the smallest - building all five would add minutes for no extra
      # signal about isolation.
      - run: npm run sandbox:build python
      - run: npm run sandbox:check python
      # Runs real hostile submissions (network access, fork bomb, memory bomb,
      # writes outside the work directory) and fails the build if any escapes.
      # This is the check that would catch a regression in the security flags.
      - run: npm run sandbox:verify

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
