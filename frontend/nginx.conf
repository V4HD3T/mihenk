# nginx serves the built SPA and fronts the API on the same origin.
#
# Same-origin matters for more than tidiness: it means the browser never makes a
# cross-origin request, so CORS never enters the picture in production, and the
# built assets contain no hardcoded API hostname.

upstream codecloud_api {
    server api:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Sent by nginx itself so the container is healthy even if the API is down.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # A submission can be a large file; the API caps it at 1 MB itself, and this
    # keeps nginx from rejecting it first with a less helpful error.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://codecloud_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API trusts exactly one proxy hop for per-IP rate limiting, so this
        # header is what makes the limiter see the real client rather than nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grading is asynchronous, but the interactive "Run" button holds the
        # connection open for the length of a container run.
        proxy_read_timeout 120s;
    }

    # Grading results are pushed over this socket; it must not be buffered or
    # closed on idle the way a normal proxied request would be.
    location /ws {
        proxy_pass http://codecloud_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Deliberately NOT proxied: metrics are operational detail and are reached
    # directly on the API's port from inside the network, not published here.

    # Hashed assets never change under the same name, so they can be cached hard.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback: every other path is a client-side route, so serve index.html
    # and let the router decide. index.html itself must never be cached, or a
    # deploy leaves browsers pointing at assets that no longer exist.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
